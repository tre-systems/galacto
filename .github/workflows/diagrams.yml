name: Architecture diagrams

on:
  pull_request:
    paths:
      - 'docs/diagrams/**'
      - 'scripts/render-diagrams.mjs'
      - 'scripts/check-diagrams.mjs'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'docs/diagrams/**'
      - 'scripts/render-diagrams.mjs'
      - 'scripts/check-diagrams.mjs'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'

      - name: Check diagram renders
        run: npm run check:diagrams
